<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Intensity Disco Cat</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: background 0.05s; /* Faster flash transition */
        }

        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #start-btn {
            padding: 25px 60px;
            font-size: 28px;
            background: #ff00ff;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 50px #ff00ff;
        }

        /* --- THE DISCO LIGHTS (Stronger Opacity) --- */
        .light {
            position: absolute;
            width: 80vw;
            height: 80vh;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.6; /* Increased opacity */
            z-index: 1;
            display: none;
            transition: background 0.1s;
        }
        #light-left { top: -10%; left: -10%; }
        #light-right { bottom: -10%; right: -10%; }

        /* --- THE CAT --- */
        #cat-container {
            display: none;
            width: 300px;
            height: 300px;
            z-index: 10;
        }

        .dancing {
            /* Sync: 140 BPM = 0.428s */
            animation: beat-bounce 0.428s infinite alternate cubic-bezier(0.6, 0, 0.4, 1);
        }

        @keyframes beat-bounce {
            0% { transform: scale(1.3, 0.7) translateY(40px); }
            100% { transform: scale(0.7, 1.3) translateY(-80px); }
        }

        #cat-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 30px #00ffff);
        }
    </style>
</head>
<body>

    <div id="overlay">
        <button id="start-btn" onclick="startParty()">ENTER DISCO</button>
    </div>

    <div id="light-left" class="light"></div>
    <div id="light-right" class="light"></div>

    <div id="cat-container">
        <svg id="cat-svg" viewBox="0 0 100 100">
            <path id="cat-body" d="M50 20 C 30 20, 20 35, 20 55 C 20 75, 30 90, 50 90 C 70 90, 80 75, 80 55 C 80 35, 70 20, 50 20" fill="#00ffff" />
            <path d="M30 30 L 15 5 L 45 25 Z" fill="#00ffff" class="cat-part" />
            <path d="M70 30 L 85 5 L 55 25 Z" fill="#00ffff" class="cat-part" />
            <circle cx="40" cy="50" r="4" fill="#111" />
            <circle cx="60" cy="50" r="4" fill="#111" />
            <path d="M45 65 Q 50 70, 55 65" fill="none" stroke="#111" stroke-width="2" />
        </svg>
    </div>

    <audio id="music" loop>
        <source src="Hookah Bar-(SambalpuriStar.In).mp3" type="audio/mpeg">
    </audio>

    <script>
        const music = document.getElementById('music');
        const overlay = document.getElementById('overlay');
        const container = document.getElementById('cat-container');
        const lLeft = document.getElementById('light-left');
        const lRight = document.getElementById('light-right');
        const bodyParts = [document.getElementById('cat-body'), ...document.querySelectorAll('.cat-part')];

        function startParty() {
            overlay.style.display = 'none';
            container.style.display = 'block';
            lLeft.style.display = 'block';
            lRight.style.display = 'block';
            
            music.play().then(() => {
                container.classList.add('dancing');
                syncEverything();
            });
        }

        function syncEverything() {
            const colors = ['#ff00ff', '#00ffff', '#ffff00', '#ff3300', '#00ff00', '#ffffff'];
            
            setInterval(() => {
                const c1 = colors[Math.floor(Math.random() * colors.length)];
                const c2 = colors[Math.floor(Math.random() * colors.length)];
                
                // Change Cat Color
                bodyParts.forEach(part => part.setAttribute('fill', c1));
                document.getElementById('cat-svg').style.filter = `drop-shadow(0 0 50px ${c1})`;

                // Change Disco Lights
                lLeft.style.background = c1;
                lRight.style.background = c2;

                // Strong Background Flash (The "Strobe" effect)
                document.body.style.backgroundColor = `${c2}22`; // Very light version of color
                setTimeout(() => {
                    document.body.style.backgroundColor = '#000';
                }, 100);

            }, 428); // 140 BPM Hookah Bar Beat
        }
    </script>
</body>
</html>
