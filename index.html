<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extreme Shake Disco</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            /* Smooth zoom effect for the whole screen */
            transition: transform 0.1s ease-out, background-color 0.05s;
        }

        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #start-btn {
            padding: 25px 60px;
            font-size: 28px;
            background: #ff00ff;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 50px #ff00ff;
        }

        /* --- EXTREME SHAKE & GLITCH --- */
        .extreme-shake {
            animation: heavyShake 0.15s cubic-bezier(.36,.07,.19,.97) both;
            transform: scale(1.05); /* Slight zoom on impact */
        }

        @keyframes heavyShake {
            10%, 90% { transform: translate3d(-4px, 0, 0) scale(1.05); }
            20%, 80% { transform: translate3d(8px, 0, 0) scale(1.05); }
            30%, 50%, 70% { transform: translate3d(-12px, -5px, 0) scale(1.05); }
            40%, 60% { transform: translate3d(12px, 5px, 0) scale(1.05); }
        }

        /* --- THE CAT --- */
        #cat-container {
            display: none;
            width: 250px;
            height: 250px;
            z-index: 10;
        }

        .dancing {
            animation: beat-bounce 0.428s infinite alternate cubic-bezier(0.6, 0, 0.4, 1);
        }

        @keyframes beat-bounce {
            0% { transform: scale(1.5, 0.5) translateY(40px); }
            100% { transform: scale(0.6, 1.4) translateY(-120px); }
        }

        #cat-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 30px #00ffcc);
        }

        /* --- SHOCKWAVES --- */
        .wave {
            position: absolute;
            border: 4px solid #fff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            animation: wave-expand 0.4s ease-out forwards;
        }

        @keyframes wave-expand {
            0% { width: 100px; height: 100px; opacity: 1; transform: scale(0.5); }
            100% { width: 600px; height: 600px; opacity: 0; transform: scale(1.5); }
        }
    </style>
</head>
<body id="main-body">

    <div id="overlay">
        <button id="start-btn" onclick="startParty()">ACTIVATE BASS</button>
    </div>

    <div id="cat-container">
        <svg id="cat-svg" viewBox="0 0 100 100">
            <path id="cat-body" d="M50 20 C 30 20, 20 35, 20 55 C 20 75, 30 90, 50 90 C 70 90, 80 75, 80 55 C 80 35, 70 20, 50 20" fill="#00ffcc" />
            <path d="M30 30 L 15 5 L 45 25 Z" fill="#00ffcc" class="cat-part" />
            <path d="M70 30 L 85 5 L 55 25 Z" fill="#00ffcc" class="cat-part" />
            <circle cx="40" cy="50" r="4" fill="#111" />
            <circle cx="60" cy="50" r="4" fill="#111" />
            <path d="M45 65 Q 50 70, 55 65" fill="none" stroke="#111" stroke-width="2" />
        </svg>
    </div>

    <audio id="music" loop>
        <source src="Hookah Bar-(SambalpuriStar.In).mp3" type="audio/mpeg">
    </audio>

    <script>
        const music = document.getElementById('music');
        const overlay = document.getElementById('overlay');
        const container = document.getElementById('cat-container');
        const bodyTag = document.getElementById('main-body');
        const bodyParts = [document.getElementById('cat-body'), ...document.querySelectorAll('.cat-part')];

        function startParty() {
            overlay.style.display = 'none';
            container.style.display = 'block';
            
            music.play().then(() => {
                container.classList.add('dancing');
                syncHeavyEffects();
            });
        }

        function syncHeavyEffects() {
            const colors = ['#ff00ff', '#00ffff', '#ffff00', '#ff3300', '#00ff00', '#ffffff'];
            
            setInterval(() => {
                const c1 = colors[Math.floor(Math.random() * colors.length)];
                
                // 1. Color Change
                bodyParts.forEach(part => part.setAttribute('fill', c1));
                document.getElementById('cat-svg').style.filter = `drop-shadow(0 0 50px ${c1})`;
                
                // 2. EXTREME SHAKE (Triggers exactly when cat "hits" the beat)
                bodyTag.classList.add('extreme-shake');
                setTimeout(() => bodyTag.classList.remove('extreme-shake'), 150);

                // 3. Background Flash
                bodyTag.style.backgroundColor = `${c1}44`;
                setTimeout(() => bodyTag.style.backgroundColor = '#000', 80);

                // 4. Create Wave
                createWave(c1);

            }, 428); // 140 BPM
        }

        function createWave(color) {
            const rect = container.getBoundingClientRect();
            const wave = document.createElement('div');
            wave.className = 'wave';
            
            wave.style.left = (window.innerWidth / 2) - 50 + 'px';
            wave.style.top = (window.innerHeight / 2) - 50 + 'px';
            
            wave.style.borderColor = color;
            wave.style.boxShadow = `0 0 30px ${color}`;
            
            document.body.appendChild(wave);
            setTimeout(() => wave.remove(), 400);
        }
    </script>
</body>
</html>
