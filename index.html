<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Trail Disco</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: background 0.05s;
        }

        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #start-btn {
            padding: 25px 60px;
            font-size: 28px;
            background: #ff00ff;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 50px #ff00ff;
        }

        /* --- SCREEN SHAKE EFFECT --- */
        .shake {
            animation: shakeScreen 0.1s ease-in-out;
        }

        @keyframes shakeScreen {
            0% { transform: translate(0,0); }
            25% { transform: translate(3px, 3px); }
            50% { transform: translate(-3px, -3px); }
            75% { transform: translate(3px, -3px); }
            100% { transform: translate(0,0); }
        }

        /* --- THE DISCO LIGHTS --- */
        .light {
            position: absolute;
            width: 90vw;
            height: 90vh;
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.6;
            z-index: 1;
            display: none;
        }
        #light-left { top: -20%; left: -20%; }
        #light-right { bottom: -20%; right: -20%; }

        /* --- THE CAT --- */
        #cat-container {
            display: none;
            width: 250px;
            height: 250px;
            z-index: 10;
        }

        .dancing {
            animation: beat-bounce 0.428s infinite alternate cubic-bezier(0.6, 0, 0.4, 1);
        }

        @keyframes beat-bounce {
            0% { transform: scale(1.4, 0.6) translateY(20px); }
            100% { transform: scale(0.6, 1.4) translateY(-100px); }
        }

        #cat-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 30px #00ffcc);
        }

        /* --- NEON TRAILS --- */
        .trail {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            animation: trail-fade 0.5s forwards;
        }

        @keyframes trail-fade {
            0% { opacity: 0.8; transform: scale(1); }
            100% { opacity: 0; transform: scale(0); }
        }
    </style>
</head>
<body id="main-body">

    <div id="overlay">
        <button id="start-btn" onclick="startParty()">SPARKLE PARTY</button>
    </div>

    <div id="light-left" class="light"></div>
    <div id="light-right" class="light"></div>

    <div id="cat-container">
        <svg id="cat-svg" viewBox="0 0 100 100">
            <path id="cat-body" d="M50 20 C 30 20, 20 35, 20 55 C 20 75, 30 90, 50 90 C 70 90, 80 75, 80 55 C 80 35, 70 20, 50 20" fill="#00ffcc" />
            <path d="M30 30 L 15 5 L 45 25 Z" fill="#00ffcc" class="cat-part" />
            <path d="M70 30 L 85 5 L 55 25 Z" fill="#00ffcc" class="cat-part" />
            <circle cx="40" cy="50" r="4" fill="#111" />
            <circle cx="60" cy="50" r="4" fill="#111" />
            <path d="M45 65 Q 50 70, 55 65" fill="none" stroke="#111" stroke-width="2" />
        </svg>
    </div>

    <audio id="music" loop>
        <source src="Hookah Bar-(SambalpuriStar.In).mp3" type="audio/mpeg">
    </audio>

    <script>
        const music = document.getElementById('music');
        const overlay = document.getElementById('overlay');
        const container = document.getElementById('cat-container');
        const bodyTag = document.getElementById('main-body');
        const lLeft = document.getElementById('light-left');
        const lRight = document.getElementById('light-right');
        const bodyParts = [document.getElementById('cat-body'), ...document.querySelectorAll('.cat-part')];

        function startParty() {
            overlay.style.display = 'none';
            container.style.display = 'block';
            lLeft.style.display = 'block';
            lRight.style.display = 'block';
            
            music.play().then(() => {
                container.classList.add('dancing');
                syncEffects();
            });
        }

        function syncEffects() {
            const colors = ['#ff00ff', '#00ffff', '#ffff00', '#ff3300', '#00ff00', '#ffffff'];
            
            setInterval(() => {
                const c1 = colors[Math.floor(Math.random() * colors.length)];
                
                // Color Change
                bodyParts.forEach(part => part.setAttribute('fill', c1));
                document.getElementById('cat-svg').style.filter = `drop-shadow(0 0 30px ${c1})`;
                
                // Light Flash
                lLeft.style.background = c1;
                lRight.style.background = colors[Math.floor(Math.random() * colors.length)];

                // Screen Shake
                bodyTag.classList.add('shake');
                setTimeout(() => bodyTag.classList.remove('shake'), 100);

                // Background Pulse
                bodyTag.style.backgroundColor = `${c1}22`;
                setTimeout(() => bodyTag.style.backgroundColor = '#000', 150);

                // --- ADD NEON TRAIL ---
                createTrail(c1);

            }, 428); // 140 BPM
        }

        function createTrail(color) {
            const rect = container.getBoundingClientRect();
            const trail = document.createElement('div');
            trail.className = 'trail';
            
            // Position trail at the cat's current position
            trail.style.left = rect.left + (rect.width / 2) + 'px';
            trail.style.top = rect.top + (rect.height / 2) + 'px';
            
            trail.style.width = '20px';
            trail.style.height = '20px';
            trail.style.backgroundColor = color;
            trail.style.boxShadow = `0 0 20px ${color}`;
            
            document.body.appendChild(trail);
            
            // Remove trail after animation
            setTimeout(() => trail.remove(), 500);
        }
    </script>
</body>
</html>
