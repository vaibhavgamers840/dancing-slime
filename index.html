<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dancing Cat Party</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* --- START OVERLAY (Required by Browsers) --- */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #222, #000);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #start-btn {
            padding: 25px 60px;
            font-size: 28px;
            background: #ff00ff;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 40px #ff00ff;
            transition: transform 0.2s;
        }
        #start-btn:hover { transform: scale(1.1); }

        /* --- THE CAT --- */
        #cat-container {
            display: none;
            position: relative;
            width: 300px;
            height: 300px;
        }

        #cat-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px #00ffcc);
        }

        /* The Dance Move */
        .dancing {
            animation: cat-bounce 0.46s infinite alternate ease-in-out;
        }

        @keyframes cat-bounce {
            0% { transform: scale(1.1, 0.85) translateY(20px); }
            100% { transform: scale(0.9, 1.15) translateY(-50px) rotate(5deg); }
        }

        /* Background Visualizer Particles */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            animation: float 2s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-500px); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <button id="start-btn" onclick="startParty()">START PARTY</button>
    </div>

    <div id="cat-container">
        <svg id="cat-svg" viewBox="0 0 100 100">
            <path id="cat-body" d="M50 20 C 30 20, 20 35, 20 55 C 20 75, 30 90, 50 90 C 70 90, 80 75, 80 55 C 80 35, 70 20, 50 20" fill="#00ffcc" />
            <path d="M30 30 L 15 5 L 45 25 Z" fill="#00ffcc" id="ear1" />
            <path d="M70 30 L 85 5 L 55 25 Z" fill="#00ffcc" id="ear2" />
            <circle cx="40" cy="50" r="4" fill="#111" />
            <circle cx="60" cy="50" r="4" fill="#111" />
            <path d="M45 65 Q 50 70, 55 65" fill="none" stroke="#111" stroke-width="2" />
        </svg>
    </div>

    <audio id="music" loop>
        <source src="Hookah Bar-(SambalpuriStar.In).mp3" type="audio/mpeg">
    </audio>

    <script>
        const music = document.getElementById('music');
        const overlay = document.getElementById('overlay');
        const container = document.getElementById('cat-container');
        const body = document.getElementById('cat-body');
        const ear1 = document.getElementById('ear1');
        const ear2 = document.getElementById('ear2');

        function startParty() {
            // Hide button
            overlay.style.display = 'none';
            container.style.display = 'block';
            
            // Play Music
            music.play().then(() => {
                container.classList.add('dancing');
                initVisuals();
            }).catch(e => {
                alert("Error: Please make sure the MP3 file is in the same folder and named correctly!");
            });
        }

        function initVisuals() {
            const colors = ['#00ffcc', '#ff00ff', '#ffff00', '#0099ff', '#ff3300'];
            
            // Sync Colors to Beat
            setInterval(() => {
                const color = colors[Math.floor(Math.random() * colors.length)];
                body.setAttribute('fill', color);
                ear1.setAttribute('fill', color);
                ear2.setAttribute('fill', color);
                document.getElementById('cat-svg').style.filter = `drop-shadow(0 0 30px ${color})`;
            }, 460); // Roughly matches the BPM

            // Particles
            setInterval(() => {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * window.innerWidth + 'px';
                p.style.top = window.innerHeight + 'px';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 2000);
            }, 100);
        }
    </script>
</body>
</html>
