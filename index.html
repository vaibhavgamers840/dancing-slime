<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitthu's Disco Cat</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial Black', Gadget, sans-serif;
        }

        /* --- THE MITTHU START SCREEN --- */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a1a1a, #000);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }

        .name-display {
            font-size: 80px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 10px;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #00ffff;
            animation: neonPulse 1s infinite alternate;
        }

        @keyframes neonPulse {
            from { transform: scale(1); text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; }
            to { transform: scale(1.1); text-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff; }
        }

        .click-hint {
            color: #555;
            margin-top: 20px;
            letter-spacing: 2px;
            font-size: 14px;
        }

        /* --- THE DANCING CAT --- */
        #cat-wrapper {
            display: none;
            position: relative; /* Container for the cat AND waves */
            width: 300px;
            height: 300px;
            z-index: 10;
        }

        .dancing {
            /* 140 BPM Sync */
            animation: beat-bounce 0.428s infinite alternate cubic-bezier(0.6, 0, 0.4, 1);
        }

        @keyframes beat-bounce {
            0% { transform: scale(1.4, 0.6) translateY(50px); }
            100% { transform: scale(0.6, 1.4) translateY(-100px); }
        }

        #cat-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 30px #00ffcc);
        }

        /* --- THE FIXED WAVE EFFECT --- */
        .wave {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 6px solid #fff;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: wave-expand 0.5s ease-out forwards;
        }

        @keyframes wave-expand {
            0% { width: 50px; height: 50px; opacity: 1; border-width: 10px; }
            100% { width: 800px; height: 800px; opacity: 0; border-width: 1px; }
        }

        /* --- SCREEN SHAKE --- */
        .shake {
            animation: heavyShake 0.1s infinite;
        }
        @keyframes heavyShake {
            0% { transform: translate(2px, 2px); }
            50% { transform: translate(-2px, -2px); }
            100% { transform: translate(2px, -2px); }
        }
    </style>
</head>
<body id="main-body">

    <div id="overlay" onclick="startParty()">
        <div class="name-display">MITTHU</div>
        <div class="click-hint">CLICK TO START THE SHOW</div>
    </div>

    <div id="cat-wrapper">
        <svg id="cat-svg" viewBox="0 0 100 100">
            <path id="cat-body" d="M50 20 C 30 20, 20 35, 20 55 C 20 75, 30 90, 50 90 C 70 90, 80 75, 80 55 C 80 35, 70 20, 50 20" fill="#00ffff" />
            <path d="M30 30 L 15 5 L 45 25 Z" fill="#00ffff" class="cat-part" />
            <path d="M70 30 L 85 5 L 55 25 Z" fill="#00ffff" class="cat-part" />
            <circle cx="40" cy="50" r="4" fill="#111" />
            <circle cx="60" cy="50" r="4" fill="#111" />
            <path d="M45 65 Q 50 70, 55 65" fill="none" stroke="#111" stroke-width="2" />
        </svg>
    </div>

    <audio id="music" loop>
        <source src="Hookah Bar-(SambalpuriStar.In).mp3" type="audio/mpeg">
    </audio>

    <script>
        const music = document.getElementById('music');
        const overlay = document.getElementById('overlay');
        const wrapper = document.getElementById('cat-wrapper');
        const bodyTag = document.getElementById('main-body');
        const bodyPath = document.getElementById('cat-body');
        const extraParts = document.querySelectorAll('.cat-part');

        function startParty() {
            overlay.style.display = 'none';
            wrapper.style.display = 'block';
            
            music.play().then(() => {
                wrapper.classList.add('dancing');
                // Start the beat-synced loop
                setInterval(syncToBeat, 428); 
            });
        }

        function syncToBeat() {
            const colors = ['#00ffff', '#ff00ff', '#ffff00', '#ff3300', '#00ff00', '#ffffff'];
            const randColor = colors[Math.floor(Math.random() * colors.length)];

            // 1. Change Cat Color
            bodyPath.setAttribute('fill', randColor);
            extraParts.forEach(p => p.setAttribute('fill', randColor));
            document.getElementById('cat-svg').style.filter = `drop-shadow(0 0 40px ${randColor})`;

            // 2. Shake the screen
            bodyTag.classList.add('shake');
            setTimeout(() => bodyTag.classList.remove('shake'), 100);

            // 3. Background Flash
            bodyTag.style.backgroundColor = `${randColor}22`;
            setTimeout(() => bodyTag.style.backgroundColor = '#000', 100);

            // 4. SPAWN WAVE (Inside the wrapper so it moves WITH the cat)
            const wave = document.createElement('div');
            wave.className = 'wave';
            wave.style.borderColor = randColor;
            wave.style.boxShadow = `0 0 20px ${randColor}`;
            wrapper.appendChild(wave);
            
            // Cleanup wave
            setTimeout(() => wave.remove(), 500);
        }
    </script>
</body>
</html>
