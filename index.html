<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Disco Beat Sync</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: background 0.1s;
        }

        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #start-btn {
            padding: 25px 60px;
            font-size: 28px;
            background: #ff00ff;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 40px #ff00ff;
        }

        /* --- THE DISCO LIGHTS --- */
        .light {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            z-index: 1;
            display: none;
        }
        #light-1 { top: -200px; left: -200px; background: #ff00ff; }
        #light-2 { bottom: -200px; right: -200px; background: #00ffff; }

        /* --- THE CAT --- */
        #cat-container {
            display: none;
            width: 350px;
            height: 350px;
            z-index: 10;
        }

        .dancing {
            /* Sync: 140 BPM = 0.428s */
            animation: beat-bounce 0.428s infinite alternate cubic-bezier(0.6, 0, 0.4, 1);
        }

        @keyframes beat-bounce {
            0% { transform: scale(1.2, 0.8) translateY(30px); }
            100% { transform: scale(0.8, 1.2) translateY(-70px); }
        }

        #cat-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px #ff00ff);
        }

        /* Flash Effect on Body */
        .flash {
            animation: color-flash 0.428s infinite alternate;
        }

        @keyframes color-flash {
            0% { filter: brightness(1) drop-shadow(0 0 20px currentColor); }
            100% { filter: brightness(1.8) drop-shadow(0 0 50px currentColor); }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <button id="start-btn" onclick="startParty()">ENTER THE CLUB</button>
    </div>

    <div id="light-1" class="light"></div>
    <div id="light-2" class="light"></div>

    <div id="cat-container">
        <svg id="cat-svg" viewBox="0 0 100 100">
            <path id="cat-body" d="M50 20 C 30 20, 20 35, 20 55 C 20 75, 30 90, 50 90 C 70 90, 80 75, 80 55 C 80 35, 70 20, 50 20" fill="#ff00ff" />
            <path d="M30 30 L 15 5 L 45 25 Z" fill="#ff00ff" class="cat-part" />
            <path d="M70 30 L 85 5 L 55 25 Z" fill="#ff00ff" class="cat-part" />
            <circle cx="40" cy="50" r="4" fill="#111" />
            <circle cx="60" cy="50" r="4" fill="#111" />
            <path d="M45 65 Q 50 70, 55 65" fill="none" stroke="#111" stroke-width="2" />
        </svg>
    </div>

    <audio id="music" loop>
        <source src="Hookah Bar-(SambalpuriStar.In).mp3" type="audio/mpeg">
    </audio>

    <script>
        const music = document.getElementById('music');
        const overlay = document.getElementById('overlay');
        const container = document.getElementById('cat-container');
        const l1 = document.getElementById('light-1');
        const l2 = document.getElementById('light-2');
        const bodyParts = [document.getElementById('cat-body'), ...document.querySelectorAll('.cat-part')];

        function startParty() {
            overlay.style.display = 'none';
            container.style.display = 'block';
            l1.style.display = 'block';
            l2.style.display = 'block';
            
            music.play().then(() => {
                container.classList.add('dancing');
                syncEverything();
            });
        }

        function syncEverything() {
            const colors = ['#ff00ff', '#00ffff', '#ffff00', '#ff3300', '#00ff00', '#ffffff'];
            
            setInterval(() => {
                const c1 = colors[Math.floor(Math.random() * colors.length)];
                const c2 = colors[Math.floor(Math.random() * colors.length)];
                
                // Update Cat Color
                bodyParts.forEach(part => part.setAttribute('fill', c1));
                document.getElementById('cat-svg').style.filter = `drop-shadow(0 0 40px ${c1})`;

                // Update Background Disco Lights
                l1.style.background = c1;
                l2.style.background = c2;

                // Subtle Background Flash
                document.body.style.background = `radial-gradient(circle, ${c1}11 0%, #000 80%)`;

            }, 428); // 140 BPM Sync
        }
    </script>
</body>
</html>
