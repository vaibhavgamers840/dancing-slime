<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hookah Bar Dancing Cat</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Arial', sans-serif;
        }

        /* --- START OVERLAY --- */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        button {
            padding: 20px 50px;
            font-size: 24px;
            background: #ff00ff;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px #ff00ff;
            font-weight: bold;
        }

        /* --- THE CAT --- */
        .cat-box {
            position: relative;
            width: 250px;
            height: 250px;
            display: none; /* Hidden until start */
        }

        #cat-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px #00ffcc);
        }

        /* Dance Animation */
        .dance-active {
            animation: bounce 0.45s infinite alternate ease-in-out;
        }

        @keyframes bounce {
            0% { transform: scale(1.1, 0.8) translateY(20px); }
            100% { transform: scale(0.9, 1.2) translateY(-40px); }
        }

        #volume-control {
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <button onclick="playMusic()">START PARTY</button>
    </div>

    <div class="cat-box" id="cat-box">
        <svg id="cat-svg" viewBox="0 0 100 100">
            <path id="cat-body" d="M50 20 C 30 20, 20 35, 20 55 C 20 75, 30 90, 50 90 C 70 90, 80 75, 80 55 C 80 35, 70 20, 50 20" fill="#00ffcc" />
            <path d="M30 30 L 15 5 L 45 25 Z" fill="#00ffcc" />
            <path d="M70 30 L 85 5 L 55 25 Z" fill="#00ffcc" />
            <circle cx="40" cy="50" r="4" fill="#111" />
            <circle cx="60" cy="50" r="4" fill="#111" />
            <path d="M45 65 Q 50 70, 55 65" fill="none" stroke="#111" stroke-width="2" />
        </svg>
    </div>

    <div id="volume-control">
        <label>Volume: </label>
        <input type="range" id="vol-slider" min="0" max="1" step="0.1" value="0.8">
    </div>

    <audio id="track" loop>
        <source src="http://googleusercontent.com/file_content/18" type="audio/mpeg">
    </audio>

    <script>
        const track = document.getElementById('track');
        const catBox = document.getElementById('cat-box');
        const overlay = document.getElementById('overlay');
        const slider = document.getElementById('vol-slider');

        function playMusic() {
            // Hide Overlay
            overlay.style.display = 'none';
            catBox.style.display = 'block';
            document.getElementById('volume-control').style.display = 'block';

            // Set Volume
            track.volume = 0.8;
            
            // Try to Play
            const playPromise = track.play();

            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    // Music started! Start the dance
                    catBox.classList.add('dance-active');
                    startColorFlash();
                }).catch(error => {
                    console.log("Playback failed:", error);
                    alert("Browser blocked audio. Please click the screen again!");
                });
            }
        }

        slider.addEventListener('input', (e) => {
            track.volume = e.target.value;
        });

        function startColorFlash() {
            const colors = ['#00ffcc', '#ff00ff', '#ffff00', '#ff3300'];
            const body = document.getElementById('cat-body');
            setInterval(() => {
                const color = colors[Math.floor(Math.random() * colors.length)];
                body.setAttribute('fill', color);
                document.getElementById('cat-svg').style.filter = `drop-shadow(0 0 30px ${color})`;
            }, 450);
        }
    </script>
</body>
</html>
