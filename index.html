<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hookah Bar Cat</title>
    <style>
        body {
            margin: 0;
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: white;
            cursor: pointer;
        }

        /* --- THE DANCING CAT --- */
        .pet-container {
            position: relative;
            transition: all 0.1s ease-out;
            z-index: 10;
        }

        .cat {
            font-size: 20px;
            white-space: pre;
            line-height: 1.2;
            text-shadow: 0 0 10px #ff00ff;
            /* Transition for color changes */
            transition: color 0.3s, text-shadow 0.3s;
            color: #00ffcc;
        }

        /* --- DANCE ANIMATIONS SYNCED TO HOOKAH BAR --- */
        
        /* 1. Slow Sway (Idle/Verses) */
        .dancing .cat {
            animation: sway 1.2s infinite alternate ease-in-out;
        }
        @keyframes sway {
            0% { transform: rotate(-5deg) translateY(0); }
            100% { transform: rotate(5deg) translateY(-20px); }
        }

        /* 2. Fast Rave (Chorus) */
        .fast-rave {
            animation: rave 0.4s infinite alternate ease-in-out !important;
        }
        @keyframes rave {
            0% { transform: scale(1.1) rotate(-15deg); }
            100% { transform: scale(0.9) rotate(15deg) translateY(-30px); }
        }

        /* 3. Spin (Bridge) */
        .spin-mode {
            animation: spin 0.8s infinite linear !important;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- BACKGROUND PARTICLES --- */
        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            pointer-events: none;
            animation: fly 1.5s infinite linear;
        }
        @keyframes fly {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-300px) scale(0); opacity: 0; }
        }

        #ui {
            position: absolute;
            bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 10px #ff00ff;
        }
    </style>
</head>
<body>

    <div class="pet-container" id="container">
        <div class="cat" id="cat">
 /\_/\
( o.o )
 > ^ <
        </div>
    </div>

    <div id="ui">CLICK TO DANCE</div>

    <audio id="party-music" loop>
        <source src="http://googleusercontent.com/file_content/18" type="audio/mpeg">
    </audio>

    <script>
        const cat = document.getElementById('cat');
        const container = document.getElementById('container');
        const music = document.getElementById('party-music');
        const uiText = document.getElementById('ui');
        let isPartyMode = false;

        const colors = ['#00ffcc', '#ff00ff', '#ff3300', '#ffff00'];

        // 1. Click to Start
        document.body.addEventListener('click', () => {
            if (!isPartyMode) {
                music.play();
                isPartyMode = true;
                container.classList.add('dancing');
                uiText.innerText = "HOOKAH BAR!";
                startHookahSync();
            }
        });

        // 2. Sync Dance & Color to Music
        function startHookahSync() {
            // Change colors rapidly with the beat (every 0.4 seconds)
            setInterval(() => {
                if(!isPartyMode) return;
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                cat.style.color = randomColor;
                cat.style.textShadow = `0 0 15px ${randomColor}`;
            }, 400);

            // Change dance move every 8 seconds
            setInterval(() => {
                if(!isPartyMode) return;
                cat.classList.remove('fast-rave', 'spin-mode');
                const rand = Math.random();
                if (rand < 0.4) {
                    cat.classList.add('fast-rave');
                } else if (rand < 0.7) {
                    cat.classList.add('spin-mode');
                }
            }, 8000);
        }

        // 3. Follow Mouse
        document.addEventListener('mousemove', (e) => {
            if(!isPartyMode) return;
            const x = (window.innerWidth / 2 - e.pageX) / 30;
            const y = (window.innerHeight / 2 - e.pageY) / 30;
            container.style.transform = `translateX(${-x}px) translateY(${-y}px)`;
        });

        // 4. Create particles
        function createParticle() {
            if(!isPartyMode) return;
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * window.innerWidth + 'px';
            p.style.top = window.innerHeight + 'px';
            p.style.background = colors[Math.floor(Math.random() * colors.length)];
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 1500);
        }
        setInterval(createParticle, 100);
    </script>
</body>
</html>
