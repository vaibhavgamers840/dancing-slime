<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hookah Bar Dancing Cat</title>
    <style>
        body {
            margin: 0;
            background: #050505;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        /* --- START BUTTON --- */
        #start-overlay {
            position: absolute;
            z-index: 100;
            background: rgba(0,0,0,0.8);
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #play-button {
            padding: 20px 40px;
            font-size: 24px;
            background: #00ffcc;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 20px #00ffcc;
        }

        /* --- THE DANCING CAT --- */
        .cat-container {
            position: relative;
            width: 200px;
            height: 200px;
            transition: transform 0.1s ease-out;
        }

        #cat-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 15px #00ffcc);
        }

        /* Body Movement Animations */
        .dancing #cat-svg {
            animation: catDance 0.45s infinite alternate ease-in-out;
        }

        @keyframes catDance {
            0% { transform: scale(1.1, 0.9) translateY(10px); }
            100% { transform: scale(0.9, 1.1) translateY(-30px) rotate(5deg); }
        }

        /* Background Glow */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0,255,204,0.3) 0%, transparent 70%);
            z-index: -1;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <button id="play-button" onclick="startTheParty()">CLICK TO START HOOKAH BAR</button>
    </div>

    <div class="bg-glow" id="glow"></div>

    <div class="cat-container" id="container">
        <svg id="cat-svg" viewBox="0 0 100 100">
            <path id="body-color" d="M50 20 C 30 20, 20 35, 20 55 C 20 75, 30 90, 50 90 C 70 90, 80 75, 80 55 C 80 35, 70 20, 50 20" fill="#00ffcc" />
            <path d="M30 30 L 15 5 L 45 25 Z" fill="#00ffcc" />
            <path d="M70 30 L 85 5 L 55 25 Z" fill="#00ffcc" />
            <circle cx="40" cy="50" r="4" fill="#111" />
            <circle cx="60" cy="50" r="4" fill="#111" />
            <path d="M45 65 Q 50 70, 55 65" fill="none" stroke="#111" stroke-width="2" />
        </svg>
    </div>

    <audio id="party-music" loop>
        <source src="http://googleusercontent.com/file_content/18" type="audio/mpeg">
    </audio>

    <script>
        const music = document.getElementById('party-music');
        const overlay = document.getElementById('start-overlay');
        const container = document.getElementById('container');
        const bodyColor = document.getElementById('body-color');
        const glow = document.getElementById('glow');

        const neonColors = ['#00ffcc', '#ff00ff', '#ffff00', '#ff3300'];

        function startTheParty() {
            // 1. Hide the overlay
            overlay.style.display = 'none';
            
            // 2. Play the music
            music.play().catch(error => {
                console.log("Music failed to play: ", error);
                alert("Please ensure your volume is up!");
            });

            // 3. Start animations
            container.classList.add('dancing');

            // 4. Color sync loop
            setInterval(() => {
                const randomColor = neonColors[Math.floor(Math.random() * neonColors.length)];
                bodyColor.setAttribute('fill', randomColor);
                document.getElementById('cat-svg').style.filter = `drop-shadow(0 0 20px ${randomColor})`;
                glow.style.background = `radial-gradient(circle, ${randomColor}44 0%, transparent 70%)`;
            }, 450); // Matches the dance beat
        }
    </script>
</body>
</html>
